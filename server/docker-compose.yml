name: repsy

services:
  postgres:
    image: postgres:17
    container_name: repsy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: repsy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: repsy_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repsy -d repsy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
